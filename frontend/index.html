<!doctype html>
<!-- SimpleFinance web client shell. Dark is the default color mode so the first
     paint matches what ThemeProvider applies once React boots. -->
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#282828" />
    <meta
      name="description"
      content="SimpleFinance: suas finanças pessoais consolidadas via Open Finance, rodando no seu próprio servidor."
    />
    <title>SimpleFinance</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inter is the only web font the stylesheets use; system fonts are the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
